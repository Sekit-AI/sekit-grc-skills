name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate and package plugins
        run: npm test

      - name: Verify tag and manifest versions
        run: npm run verify-release -- "$GITHUB_REF_NAME"

      - name: Create checksum
        run: sha256sum dist/sekit-grc.plugin > dist/sekit-grc.plugin.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/sekit-grc.plugin
          dist/sekit-grc.plugin.sha256
          --verify-tag
          --generate-notes
          --title "Sekit GRC $GITHUB_REF_NAME"
